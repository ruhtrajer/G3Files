<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6ab7f7"/>
      <stop offset="100%" stop-color="#1a6bb5"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f4fd"/>
      <stop offset="100%" stop-color="#b0d4f1"/>
    </linearGradient>
    <linearGradient id="stand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4d4d4"/>
      <stop offset="100%" stop-color="#999"/>
    </linearGradient>
  </defs>

  <!-- Stand -->
  <rect x="175" y="310" width="50" height="40" rx="3" fill="url(#stand)"/>
  <rect x="155" y="340" width="90" height="12" rx="6" fill="url(#stand)"/>

  <!-- Monitor body -->
  <ellipse cx="200" cy="200" rx="130" ry="130" fill="url(#body)"/>
  <rect x="70" y="70" width="260" height="260" rx="20" fill="url(#body)"/>

  <!-- Screen bezel -->
  <rect x="90" y="100" width="220" height="200" rx="8" fill="#222"/>
  <rect x="100" y="110" width="200" height="170" rx="4" fill="url(#screen)"/>

  <!-- Chin (G3 logo area) -->
  <rect x="170" y="285" width="60" height="20" rx="3" fill="#1a6bb5"/>

  <!-- File icon on screen -->
  <rect x="155" y="135" width="90" height="110" rx="6" fill="#fff" stroke="#ccc" stroke-width="2"/>
  <rect x="205" y="135" width="36" height="30" rx="3" fill="#4a90d9"/>
  <line x1="165" y1="175" x2="235" y2="175" stroke="#ccc" stroke-width="3" stroke-linecap="round"/>
  <line x1="165" y1="190" x2="220" y2="190" stroke="#ccc" stroke-width="3" stroke-linecap="round"/>
  <line x1="165" y1="205" x2="210" y2="205" stroke="#ccc" stroke-width="3" stroke-linecap="round"/>

  <!-- Arrow pointing right (download/transfer indicator) -->
  <polygon points="270,190 290,175 290,185 310,185 310,195 290,195 290,205" fill="#4a90d9"/>

  <!-- G3 text on chin -->
  <text x="200" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="14" fill="#fff">G3</text>
</svg>
